# --- Site identity ---
title: Jiyoon Kim
tagline: "Physical AI · Robot Foundation Models"
description: >-
  Research notes, paper and tech reviews, publications, and projects
  on physical AI and robot foundation models.
author: Jiyoon Kim
email: jiyoon0630@gmail.com
lang: en

# User site: served at the domain root.
url: "https://jiyoon0630.github.io"
baseurl: ""

# --- Build settings ---
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  math_engine: null          # let MathJax handle all math (both $...$ and $$...$$)
  syntax_highlighter: rouge
  syntax_highlighter_opts:
    default_lang: text

# Her timezone: without this, a post written in the evening renders as the
# next day, because the build machine runs in UTC.
timezone: America/Los_Angeles

permalink: /notes/:title/

# Every note (a post in _posts/) uses the paper layout by default.
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: paper
      kind: paper-review

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

sass:
  style: compressed

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - CLAUDE.md
  - vendor
  - .github
  - templates
  - scripts
  - skills-lock.json
  # Internal source documents and unreviewed drafts. Gitignored as well, but
  # without this a local build copies them into _site as publishable pages.
  - sources
  - drafts
