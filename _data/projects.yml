- name: "Tool-use reliability for an enterprise LLM agent"
  period: "2025"
  tagline: "Fine-tuning an LLM to pick the right tools and chain their outputs across turns."
  description: >-
    Built with Cohere for an LG corporate-management agent: SFT on tool-call
    trajectories plus a chosen/rejected pair pipeline for DPO, with GRPO
    experimentation, delivering a PoC that contributed to a business win. Also
    contributed to an agentic evaluation set (~60 business/finance queries requiring
    retrieval and SQL) for Korean instruction-following and tool use.
  name_ko: "기업용 LLM 에이전트의 도구 사용 신뢰성"
  tagline_ko: "LLM이 올바른 도구를 고르고 여러 턴에 걸쳐 출력을 이어 쓰도록 fine-tuning."
  description_ko: >-
    LG 경영관리 에이전트를 위해 Cohere와 함께 만들었다. 도구 호출 trajectory에 대한
    SFT와 DPO용 chosen/rejected 쌍 파이프라인을 구축하고 GRPO를 실험해, 사업 수주에
    기여한 PoC를 제공했다. 검색과 SQL이 필요한 경영·재무 질의 약 60개로 이루어진
    한국어 지시 이행·도구 사용 agentic 평가셋 구축에도 참여했다.
  tags: [Agentic AI, Tool Use, LLM Fine-tuning, DPO]
  selected: false
  links:
    - label: "arXiv (acknowledged)"
      label_ko: "arXiv (감사의 글)"
      url: "https://arxiv.org/abs/2606.31648"

- name: "DRAG — generative image AI engine"
  period: "2023 – 2025"
  tagline: "Research-to-product: a personalized image-generation engine shipped as SaaS."
  description: >-
    Took diffusion personalization from research to a commercial SaaS — feature
    packaging, service site, and patent filing — while migrating the engine across
    three model generations (SD 1.5 → SDXL → FLUX.1) and delivering customer PoCs
    across digital marketing and UI/UX. Alongside it, built a human-preference
    training pipeline for Hyundai Motor Group's concept-car design PoC: VLM-automated
    preference labeling and a DPO-trained diffusion model that distills a larger
    model into a compact deployable one.
  name_ko: "DRAG — 생성형 이미지 AI 엔진"
  tagline_ko: "연구에서 제품까지: SaaS로 출시한 개인화 이미지 생성 엔진."
  description_ko: >-
    Diffusion 개인화 기술을 연구에서 상용 SaaS까지 가져갔다. 기능 패키징, 서비스
    사이트, 특허 출원을 진행했고, 엔진을 세 세대의 모델(SD 1.5 → SDXL → FLUX.1)로
    옮기면서 디지털 마케팅과 UI/UX 분야의 고객 PoC를 수행했다. 함께 현대자동차그룹의
    컨셉카 디자인 PoC를 위한 사람 선호 학습 파이프라인을 구축했다. VLM으로 선호
    라벨링을 자동화하고, DPO로 학습한 diffusion 모델로 큰 모델을 배포 가능한 작은
    모델로 증류했다.
  tags: [Diffusion, Preference Optimization, Productization, SaaS]
  selected: false
  links:
