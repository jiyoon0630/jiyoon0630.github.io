<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 602" width="1440" height="602" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="[Era 1] Action Generation via Naive Regression">
<title>[Era 1] Action Generation via Naive Regression</title>
<rect width="1440" height="602" fill="#ffffff"/>
<text x="427.5" y="45.3" font-size="25" font-weight="700" fill="#111111" textLength="584.9" lengthAdjust="spacingAndGlyphs">[Era 1] “Action Generation via Naive Regression”</text><rect x="427.5" y="48.3" width="584.9" height="2" fill="#111111"/><text x="446.4" y="80.7" font-size="18" fill="#111111" textLength="547.2" lengthAdjust="spacingAndGlyphs">Directly predicting robot actions from observations (images, sensors)</text><polygon data-box="tag1" points="1282,37 1305,14 1434,14 1434,60 1305,60" fill="#dcefff"/><text x="1315.5" y="42.6" font-size="18" font-weight="700" fill="#111111" textLength="100" lengthAdjust="spacingAndGlyphs" data-in="tag1">Continuous</text><rect data-box="box2" x="22" y="129.6" width="368" height="228.4" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="49.7" y="198.3" font-size="18" font-weight="700" fill="#111111" textLength="312.7" lengthAdjust="spacingAndGlyphs" data-in="box2">End-to-End Visuomotor (JMLR 2016)</text><text x="50.1" y="230.1" font-size="16" fill="#111111" textLength="311.7" lengthAdjust="spacingAndGlyphs" data-in="box2">Takes image + sensor observations as input</text><text x="43.2" y="253.3" font-size="16" fill="#111111" textLength="325.5" lengthAdjust="spacingAndGlyphs" data-in="box2">and regresses robot joint actions (joint torque)</text><text x="129.3" y="276.5" font-size="16" fill="#111111" textLength="153.4" lengthAdjust="spacingAndGlyphs" data-in="box2">through a CNN+MLP:</text><text x="74.4" y="299.7" font-size="16" font-weight="700" fill="#111111" textLength="263.2" lengthAdjust="spacingAndGlyphs" data-in="box2">the first image-based policy model</text><rect x="74.4" y="301.6" width="263.2" height="1.2" fill="#111111"/><rect data-box="box3" x="538" y="129.6" width="368" height="228.4" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="608" y="198.3" font-size="18" font-weight="700" fill="#111111" textLength="228" lengthAdjust="spacingAndGlyphs" data-in="box3">BC-Z (PMLR 2022, Google)</text><text x="557.9" y="230.1" font-size="16" fill="#111111" textLength="328.2" lengthAdjust="spacingAndGlyphs" data-in="box3">Through a method that takes natural language</text><text x="570.4" y="253.3" font-size="16" fill="#111111" textLength="303.3" lengthAdjust="spacingAndGlyphs" data-in="box3">(or a one-shot video) as input in addition to</text><text x="570.5" y="276.5" font-size="16" fill="#111111" textLength="303" lengthAdjust="spacingAndGlyphs" data-in="box3">images and predicts the end-effector pose,</text><text x="555.8" y="299.7" font-size="16" font-weight="700" fill="#111111" textLength="332.5" lengthAdjust="spacingAndGlyphs" data-in="box3">introduces the concept of task conditioning</text><rect x="555.8" y="301.6" width="332.5" height="1.2" fill="#111111"/><rect data-box="box4" x="1054" y="129.6" width="368" height="228.4" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="1085.5" y="162.3" font-size="18" font-weight="700" fill="#111111" textLength="305" lengthAdjust="spacingAndGlyphs" data-in="box4">Action Chunking with Transformers</text><text x="1187.5" y="187.9" font-size="18" font-weight="700" fill="#111111" textLength="101.1" lengthAdjust="spacingAndGlyphs" data-in="box4">(arXiv 2023)</text><rect x="1118.3" y="275.2" width="257.3" height="18.6" fill="#fff200"/><rect x="1097.8" y="298.4" width="280.3" height="18.6" fill="#fff200"/><rect x="1203.1" y="321.6" width="69.7" height="18.6" fill="#fff200"/><text x="1094.8" y="219.6" font-size="16" fill="#111111" textLength="209.9" lengthAdjust="spacingAndGlyphs" data-in="box4">From the current observation,</text><text x="1309.2" y="219.6" font-size="16" font-weight="700" fill="#111111" textLength="72" lengthAdjust="spacingAndGlyphs" data-in="box4">proposes</text><text x="1098" y="242.8" font-size="16" font-weight="700" fill="#111111" textLength="280.1" lengthAdjust="spacingAndGlyphs" data-in="box4">predicting k future timesteps at once</text><text x="1161.8" y="266" font-size="16" font-weight="700" fill="#111111" textLength="152.4" lengthAdjust="spacingAndGlyphs" data-in="box4">(= Action Chunking)</text><text x="1101.9" y="289.2" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box4">→</text><text x="1119.8" y="289.2" font-size="16" font-weight="700" fill="#111111" textLength="254.3" lengthAdjust="spacingAndGlyphs" data-in="box4">guarantees temporal consistency</text><text x="1099.3" y="312.4" font-size="16" font-weight="700" fill="#111111" textLength="277.3" lengthAdjust="spacingAndGlyphs" data-in="box4">(Smoothness); the standard for RFM</text><text x="1204.6" y="335.6" font-size="16" font-weight="700" fill="#111111" textLength="66.7" lengthAdjust="spacingAndGlyphs" data-in="box4">research</text><rect x="1309.2" y="221.6" width="72" height="1.2" fill="#111111"/><rect x="1098" y="244.8" width="280.1" height="1.2" fill="#111111"/><rect x="1161.8" y="268" width="152.4" height="1.2" fill="#111111"/><rect x="1119.8" y="291.2" width="254.3" height="1.2" fill="#111111"/><rect x="1099.3" y="314.4" width="277.3" height="1.2" fill="#111111"/><rect x="1204.6" y="337.6" width="66.7" height="1.2" fill="#111111"/><line x1="390" y1="243.8" x2="525" y2="243.8" stroke="#1f1f1f" stroke-width="2"/><polygon points="538,243.8 525,250.8 525,236.8" fill="#1f1f1f"/><text x="396.3" y="208.7" font-size="15" font-weight="700" fill="#1a7f37" textLength="135.5" lengthAdjust="spacingAndGlyphs">+ Natural-language</text><text x="417.8" y="229.7" font-size="15" font-weight="700" fill="#1a7f37" textLength="92.5" lengthAdjust="spacingAndGlyphs">Conditioning</text><line x1="906" y1="243.8" x2="1041" y2="243.8" stroke="#1f1f1f" stroke-width="2"/><polygon points="1054,243.8 1041,250.8 1041,236.8" fill="#1f1f1f"/><text x="913.8" y="229.7" font-size="15" font-weight="700" fill="#1a7f37" textLength="132.4" lengthAdjust="spacingAndGlyphs">+ Action Chunking</text><text x="22" y="385.9" font-size="15" fill="#1a7f37" textLength="416.6" lengthAdjust="spacingAndGlyphs">Sergey Levine: Professor at UC Berkeley, Physical Intelligence</text><text x="36" y="405.9" font-size="15" fill="#1a7f37" textLength="75" lengthAdjust="spacingAndGlyphs">Co-founder</text><text x="22" y="430.9" font-size="15" fill="#1a7f37" textLength="415.8" lengthAdjust="spacingAndGlyphs">Chelsea Finn: Professor at Stanford Univ, Physical Intelligence</text><text x="36" y="450.9" font-size="15" fill="#1a7f37" textLength="75" lengthAdjust="spacingAndGlyphs">Co-founder</text><text x="22" y="475.9" font-size="15" fill="#1a7f37" textLength="417.4" lengthAdjust="spacingAndGlyphs">Pieter Abbeel: Professor at UC Berkeley, Covariant Co-founder</text><text x="22" y="500.9" font-size="15" fill="#1a7f37" textLength="487.7" lengthAdjust="spacingAndGlyphs">Trevor Darrell: Professor at UC Berkeley, BAIR Lab Founding Co-Director</text><text x="1054" y="385.9" font-size="15" fill="#1a7f37" textLength="350.2" lengthAdjust="spacingAndGlyphs">Tony Zhao: Sunday Robotics Co-founder, advised by</text><text x="1068" y="405.9" font-size="15" fill="#1a7f37" textLength="88.4" lengthAdjust="spacingAndGlyphs">Chelsea Finn</text><text x="797" y="453.5" font-size="21" fill="#111111" textLength="142.4" lengthAdjust="spacingAndGlyphs">『Limitations』</text><rect x="801.5" y="474" width="563" height="18.6" fill="#fff200"/><rect x="823.5" y="500" width="163.5" height="18.6" fill="#fff200"/><text x="803" y="488" font-size="16" font-weight="700" fill="#111111" textLength="560" lengthAdjust="spacingAndGlyphs">① Cannot reflect the diverse valid trajectories for performing a robot Task</text><text x="825" y="514" font-size="16" font-weight="700" fill="#111111" textLength="160.5" lengthAdjust="spacingAndGlyphs">(= Multimodal action)</text><rect x="803" y="490" width="560" height="1.2" fill="#111111"/><rect x="825" y="516" width="160.5" height="1.2" fill="#111111"/><rect x="801.5" y="531.2" width="599.9" height="18.6" fill="#fff200"/><rect x="823.5" y="557.2" width="49.2" height="18.6" fill="#fff200"/><text x="803" y="545.2" font-size="16" font-weight="700" fill="#111111" textLength="596.9" lengthAdjust="spacingAndGlyphs">② Lack of video·language·robot Action pair datasets for building a Foundation</text><text x="825" y="571.2" font-size="16" font-weight="700" fill="#111111" textLength="46.2" lengthAdjust="spacingAndGlyphs">Model</text><rect x="803" y="547.2" width="596.9" height="1.2" fill="#111111"/><rect x="825" y="573.2" width="46.2" height="1.2" fill="#111111"/>
</svg>
