<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 816" width="1440" height="816" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="[Era 2A] Capturing Multimodality">
<title>[Era 2A] Capturing Multimodality</title>
<rect width="1440" height="816" fill="#ffffff"/>
<rect x="16" y="102" width="640" height="320.6" fill="none" stroke="#222222" stroke-width="1.6" stroke-dasharray="7 5"/><rect x="750" y="102" width="640" height="551" fill="none" stroke="#222222" stroke-width="1.6" stroke-dasharray="7 5"/><text x="513" y="45.3" font-size="25" font-weight="700" fill="#111111" textLength="413.9" lengthAdjust="spacingAndGlyphs">[Era 2A] “Capturing Multimodality”</text><rect x="513" y="48.3" width="413.9" height="2" fill="#111111"/><line x1="720" y1="60" x2="720" y2="74" stroke="#1f1f1f" stroke-width="2"/><line x1="336" y1="74" x2="1070" y2="74" stroke="#1f1f1f" stroke-width="2"/><line x1="336" y1="74" x2="336" y2="85" stroke="#1f1f1f" stroke-width="2"/><polygon points="336,98 329,85 343,85" fill="#1f1f1f"/><line x1="1070" y1="74" x2="1070" y2="85" stroke="#1f1f1f" stroke-width="2"/><polygon points="1070,98 1063,85 1077,85" fill="#1f1f1f"/><text x="152.6" y="140.3" font-size="17.5" fill="#111111" textLength="366.9" lengthAdjust="spacingAndGlyphs">① Explicitly separating modes by defining robot</text><text x="248.9" y="164.3" font-size="17.5" fill="#111111" textLength="174.2" lengthAdjust="spacingAndGlyphs">actions as a codebook</text><polygon data-box="tag5" points="546,143 569,120 694,120 694,166 569,166" fill="#ffebac"/><text x="592" y="148.6" font-size="18" font-weight="700" fill="#111111" textLength="71" lengthAdjust="spacingAndGlyphs" data-in="tag5">Discrete</text><text x="889.6" y="140.3" font-size="17.5" fill="#111111" textLength="360.7" lengthAdjust="spacingAndGlyphs">② Adopting Diffusion from image generation to</text><text x="942.1" y="164.3" font-size="17.5" fill="#111111" textLength="255.8" lengthAdjust="spacingAndGlyphs">model the multimodal distribution</text><polygon data-box="tag6" points="1280,143 1303,120 1428,120 1428,166 1303,166" fill="#dcefff"/><text x="1311.5" y="148.6" font-size="18" font-weight="700" fill="#111111" textLength="100" lengthAdjust="spacingAndGlyphs" data-in="tag6">Continuous</text><rect data-box="box7" x="116" y="187" width="440" height="179.6" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="176.4" y="219.7" font-size="18" font-weight="700" fill="#111111" textLength="319.1" lengthAdjust="spacingAndGlyphs" data-in="box7">Behavior Transformer (NeurIPS 2022)</text><text x="136.8" y="251.5" font-size="16" fill="#111111" textLength="398.4" lengthAdjust="spacingAndGlyphs" data-in="box7">Pre-builds a codebook from robot action data (K-means)</text><text x="133.7" y="274.7" font-size="16" fill="#111111" textLength="404.6" lengthAdjust="spacingAndGlyphs" data-in="box7">and resolves Multimodality by predicting a Discrete Mode</text><text x="232.8" y="297.9" font-size="16" fill="#111111" textLength="206.3" lengthAdjust="spacingAndGlyphs" data-in="box7">plus a fine-grained correction</text><text x="138.1" y="321.1" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box7">→</text><text x="156" y="321.1" font-size="16" font-weight="700" fill="#111111" textLength="377.9" lengthAdjust="spacingAndGlyphs" data-in="box7">the codebook must be rebuilt for each dataset, so</text><text x="252.9" y="344.3" font-size="16" font-weight="700" fill="#111111" textLength="166.3" lengthAdjust="spacingAndGlyphs" data-in="box7">no follow-up research</text><rect x="156" y="323" width="377.9" height="1.2" fill="#111111"/><rect x="252.9" y="346.2" width="166.3" height="1.2" fill="#111111"/><rect data-box="box8" x="850" y="187" width="440" height="179.6" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="952.5" y="231.3" font-size="18" font-weight="700" fill="#111111" textLength="235.1" lengthAdjust="spacingAndGlyphs" data-in="box8">Diffusion Policy (RSS 2023)</text><rect x="883.9" y="318.6" width="390.1" height="18.6" fill="#fff200"/><text x="880.1" y="263.1" font-size="16" fill="#111111" textLength="379.7" lengthAdjust="spacingAndGlyphs" data-in="box8">Adds noise to robot actions (forward), then removes it</text><text x="865.9" y="286.3" font-size="16" fill="#111111" textLength="90.7" lengthAdjust="spacingAndGlyphs" data-in="box8">step by step,</text><text x="961.1" y="286.3" font-size="16" font-weight="700" fill="#111111" textLength="312.9" lengthAdjust="spacingAndGlyphs" data-in="box8">learning a Diffusion method that restores</text><text x="965.1" y="309.5" font-size="16" font-weight="700" fill="#111111" textLength="209.8" lengthAdjust="spacingAndGlyphs" data-in="box8">the original action (reverse)</text><text x="867.5" y="332.7" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box8">→</text><text x="885.4" y="332.7" font-size="16" font-weight="700" fill="#111111" textLength="387.1" lengthAdjust="spacingAndGlyphs" data-in="box8">the backbone of today’s mainstream RFM research</text><rect x="961.1" y="288.2" width="312.9" height="1.2" fill="#111111"/><rect x="965.1" y="311.4" width="209.8" height="1.2" fill="#111111"/><rect x="885.4" y="334.6" width="387.1" height="1.2" fill="#111111"/><rect data-box="box9" x="850" y="440.6" width="440" height="156.4" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="985.5" y="473.3" font-size="18" font-weight="700" fill="#111111" textLength="169" lengthAdjust="spacingAndGlyphs" data-in="box9">RDT-1B (ICLR 2025)</text><text x="907.4" y="505.1" font-size="16" fill="#111111" textLength="325.2" lengthAdjust="spacingAndGlyphs" data-in="box9">Applies the Diffusion method to a Transformer</text><text x="891.8" y="528.3" font-size="16" fill="#111111" textLength="284.3" lengthAdjust="spacingAndGlyphs" data-in="box9">architecture (DiT) that scales easily, and</text><text x="1180.6" y="528.3" font-size="16" font-weight="700" fill="#111111" textLength="67.6" lengthAdjust="spacingAndGlyphs" data-in="box9">achieves</text><text x="882" y="551.5" font-size="16" font-weight="700" fill="#111111" textLength="376.1" lengthAdjust="spacingAndGlyphs" data-in="box9">generality through large-scale cross-embodiment</text><text x="1018" y="574.7" font-size="16" font-weight="700" fill="#111111" textLength="104" lengthAdjust="spacingAndGlyphs" data-in="box9">robot training</text><rect x="1180.6" y="530.2" width="67.6" height="1.2" fill="#111111"/><rect x="882" y="553.4" width="376.1" height="1.2" fill="#111111"/><rect x="1018" y="576.6" width="104" height="1.2" fill="#111111"/><text x="116" y="392.6" font-size="15" fill="#1a7f37" textLength="436.9" lengthAdjust="spacingAndGlyphs">Lerrel Pinto: ARI Co-founder, worked with Pieter Abbeel (Postdoc)</text><text x="850" y="392.6" font-size="15" fill="#1a7f37" textLength="192.6" lengthAdjust="spacingAndGlyphs">Cheng Chi: Sunday Robotics</text><text x="864" y="412.6" font-size="15" fill="#1a7f37" textLength="75" lengthAdjust="spacingAndGlyphs">Co-founder</text><text x="850" y="623" font-size="15" fill="#1a7f37" textLength="435.5" lengthAdjust="spacingAndGlyphs">Huazhe Xu: Professor at Tsinghua Univ, advised by Trevor Darrell</text><line x1="1070" y1="366.6" x2="1070" y2="427.6" stroke="#1f1f1f" stroke-width="2"/><polygon points="1070,440.6 1063,427.6 1077,427.6" fill="#1f1f1f"/><text x="1092" y="408" font-size="15.5" font-weight="700" fill="#1a7f37" textLength="78" lengthAdjust="spacingAndGlyphs">+ Scale-up</text><circle cx="612" cy="362.6" r="36" fill="#c00008"/><path d="M599 349.6L625 375.6M625 349.6L599 375.6" stroke="#fff" stroke-width="7.2" stroke-linecap="round"/><circle cx="1346" cy="607" r="36" fill="#2b7a1f"/><polyline points="1329.8,607.7 1341.7,618.9 1362.9,596.2" fill="none" stroke="#fff" stroke-width="7.2" stroke-linecap="round" stroke-linejoin="round"/><text x="844" y="698.5" font-size="21" fill="#111111" textLength="142.4" lengthAdjust="spacingAndGlyphs">『Limitations』</text><rect x="848.5" y="719" width="550.1" height="18.6" fill="#fff200"/><rect x="848.5" y="745" width="562.5" height="18.6" fill="#fff200"/><rect x="848.5" y="771" width="251.1" height="18.6" fill="#fff200"/><text x="850" y="733.1" font-size="16" font-weight="700" fill="#111111" textLength="547.1" lengthAdjust="spacingAndGlyphs">Because it relies on robot Teleoperation, where data collection is costly,</text><text x="850" y="759.1" font-size="16" font-weight="700" fill="#111111" textLength="559.5" lengthAdjust="spacingAndGlyphs">there are not enough video·language·robot Action pair datasets to build a</text><text x="850" y="785.1" font-size="16" font-weight="700" fill="#111111" textLength="248.1" lengthAdjust="spacingAndGlyphs">Foundation Model (Limitation ②)</text><rect x="850" y="735" width="547.1" height="1.2" fill="#111111"/><rect x="850" y="761" width="559.5" height="1.2" fill="#111111"/><rect x="850" y="787" width="248.1" height="1.2" fill="#111111"/>
</svg>
