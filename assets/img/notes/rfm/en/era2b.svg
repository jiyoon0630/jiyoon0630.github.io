<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 517" width="1440" height="517" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="[Era 2B] Leveraging the Architecture and Knowledge of Web-scale VLMs">
<title>[Era 2B] Leveraging the Architecture and Knowledge of Web-scale VLMs</title>
<rect width="1440" height="517" fill="#ffffff"/>
<text x="385.7" y="45.3" font-size="25" font-weight="700" fill="#111111" textLength="668.6" lengthAdjust="spacingAndGlyphs">[Era 2B] “Leveraging the Architecture and Knowledge of</text><text x="394" y="79.3" font-size="25" font-weight="700" fill="#111111" textLength="652" lengthAdjust="spacingAndGlyphs">VLMs (Vision Language Models) Trained at Web Scale”</text><rect x="385.7" y="48.3" width="668.6" height="2" fill="#111111"/><rect x="394" y="82.3" width="652" height="2" fill="#111111"/><text x="358.6" y="114.7" font-size="18" fill="#111111" textLength="722.9" lengthAdjust="spacingAndGlyphs">Leverages the pretrained VLM pipeline (= Autoregressive/Next-token prediction) to transfer</text><text x="358.8" y="139.7" font-size="18" fill="#111111" textLength="722.4" lengthAdjust="spacingAndGlyphs">language/visual understanding, knowledge/common sense, and Reasoning ability to RFMs</text><polygon data-box="tag10" points="1282,37 1305,14 1434,14 1434,60 1305,60" fill="#ffebac"/><text x="1330" y="42.6" font-size="18" font-weight="700" fill="#111111" textLength="71" lengthAdjust="spacingAndGlyphs" data-in="tag10">Discrete</text><rect data-box="box11" x="22" y="188.6" width="400" height="205.2" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="65" y="221.3" font-size="18" font-weight="700" fill="#111111" textLength="314.1" lengthAdjust="spacingAndGlyphs" data-in="box11">Robotics Transformer 2 (PMLR 2023,</text><text x="188" y="246.9" font-size="18" font-weight="700" fill="#111111" textLength="68" lengthAdjust="spacingAndGlyphs" data-in="box11">Google)</text><rect x="67.6" y="334.2" width="326.6" height="18.6" fill="#fff200"/><rect x="167.6" y="357.4" width="108.8" height="18.6" fill="#fff200"/><text x="44.6" y="278.6" font-size="16" fill="#111111" textLength="354.9" lengthAdjust="spacingAndGlyphs" data-in="box11">Adds robot actions to the VLM vocabulary through</text><text x="39.3" y="301.8" font-size="16" fill="#111111" textLength="90.7" lengthAdjust="spacingAndGlyphs" data-in="box11">quantization,</text><text x="134.5" y="301.8" font-size="16" font-weight="700" fill="#111111" textLength="270.2" lengthAdjust="spacingAndGlyphs" data-in="box11">controlling the robot via Next-token</text><text x="134.9" y="325" font-size="16" font-weight="700" fill="#111111" textLength="174.2" lengthAdjust="spacingAndGlyphs" data-in="box11">prediction, as LLMs do</text><text x="51.3" y="348.2" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box11">→</text><text x="69.1" y="348.2" font-size="16" font-weight="700" fill="#111111" textLength="323.6" lengthAdjust="spacingAndGlyphs" data-in="box11">the starting point of VLA (Vision Language</text><text x="169.1" y="371.4" font-size="16" font-weight="700" fill="#111111" textLength="105.8" lengthAdjust="spacingAndGlyphs" data-in="box11">Action Model)</text><rect x="134.5" y="303.8" width="270.2" height="1.2" fill="#111111"/><rect x="134.9" y="327" width="174.2" height="1.2" fill="#111111"/><rect x="69.1" y="350.2" width="323.6" height="1.2" fill="#111111"/><rect x="169.1" y="373.4" width="105.8" height="1.2" fill="#111111"/><rect data-box="box12" x="572" y="188.6" width="400" height="205.2" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="678.3" y="234.1" font-size="18" font-weight="700" fill="#111111" textLength="187.4" lengthAdjust="spacingAndGlyphs" data-in="box12">OpenVLA (arXiv 2024)</text><rect x="642.5" y="321.4" width="276.8" height="18.6" fill="#fff200"/><rect x="716" y="344.6" width="112" height="21.4" fill="#fff200"/><text x="590.6" y="265.9" font-size="16" font-weight="700" fill="#111111" textLength="358.3" lengthAdjust="spacingAndGlyphs" data-in="box12">Reproduces the RT-2 paradigm as open source</text><text x="948.9" y="265.9" font-size="16" fill="#111111" textLength="4.5" lengthAdjust="spacingAndGlyphs" data-in="box12">,</text><text x="609.9" y="289.1" font-size="16" fill="#111111" textLength="324.2" lengthAdjust="spacingAndGlyphs" data-in="box12">serving as a base + guideline for the research</text><text x="733.3" y="312.3" font-size="16" fill="#111111" textLength="77.4" lengthAdjust="spacingAndGlyphs" data-in="box12">community</text><text x="626.2" y="335.5" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box12">→</text><text x="644" y="335.5" font-size="16" font-weight="700" fill="#111111" textLength="273.8" lengthAdjust="spacingAndGlyphs" data-in="box12">the technical foundation of Physical</text><text x="717.5" y="358.7" font-size="16" font-weight="700" fill="#111111" textLength="88" lengthAdjust="spacingAndGlyphs" data-in="box12">Intelligence</text><text x="810" y="358.7" font-family="'Cambria Math', Cambria, 'Times New Roman', Times, serif" font-style="italic" font-size="17.9" font-weight="700" fill="#111111" textLength="9.8" lengthAdjust="spacingAndGlyphs" data-in="box12">π</text><text x="820.1" y="362.2" font-family="'Cambria Math', Cambria, 'Times New Roman', Times, serif" font-size="12.2" font-weight="700" fill="#111111" textLength="6.1" lengthAdjust="spacingAndGlyphs" data-in="box12">0</text><rect x="590.6" y="267.8" width="358.3" height="1.2" fill="#111111"/><rect x="644" y="337.4" width="273.8" height="1.2" fill="#111111"/><rect x="717.5" y="364.1" width="109" height="1.2" fill="#111111"/><line x1="422" y1="291.2" x2="559" y2="291.2" stroke="#1f1f1f" stroke-width="2"/><polygon points="572,291.2 559,298.2 559,284.2" fill="#1f1f1f"/><text x="437.2" y="277.1" font-size="15" font-weight="700" fill="#1a7f37" textLength="119.6" lengthAdjust="spacingAndGlyphs">+ Open-sourcing</text><text x="572" y="421.7" font-size="15" fill="#1a7f37" textLength="439.4" lengthAdjust="spacingAndGlyphs">Moojin Kim: Stanford Univ Ph.D Student advised by Chelsea Finn,</text><text x="586" y="441.7" font-size="15" fill="#1a7f37" textLength="79.2" lengthAdjust="spacingAndGlyphs">Percy Liang</text><text x="572" y="466.7" font-size="15" fill="#1a7f37" textLength="413.5" lengthAdjust="spacingAndGlyphs">Karl Pertsch: Physical Intelligence Core Engineer, worked with</text><text x="586" y="486.7" font-size="15" fill="#1a7f37" textLength="271" lengthAdjust="spacingAndGlyphs">Sergey Levine &amp; Chelsea Finn (Postdoc)</text><text x="1016" y="321" font-size="21" fill="#111111" textLength="142.4" lengthAdjust="spacingAndGlyphs">『Limitations』</text><rect x="1020.5" y="341.4" width="381.1" height="18.6" fill="#fff200"/><rect x="1020.5" y="367.4" width="340.3" height="18.6" fill="#fff200"/><rect x="1020.5" y="393.4" width="359.5" height="18.6" fill="#fff200"/><rect x="1020.5" y="419.4" width="216.4" height="18.6" fill="#fff200"/><text x="1022" y="355.5" font-size="16" font-weight="700" fill="#111111" textLength="378.1" lengthAdjust="spacingAndGlyphs">Quantizing Continuous Action values to apply the</text><text x="1022" y="381.5" font-size="16" font-weight="700" fill="#111111" textLength="337.3" lengthAdjust="spacingAndGlyphs">VLM’s Next-token prediction approach loses</text><text x="1022" y="407.5" font-size="16" font-weight="700" fill="#111111" textLength="356.5" lengthAdjust="spacingAndGlyphs">precision and limits the expression of complex</text><text x="1022" y="433.5" font-size="16" font-weight="700" fill="#111111" textLength="213.4" lengthAdjust="spacingAndGlyphs">Multimodality (Limitation ①)</text><rect x="1022" y="357.4" width="378.1" height="1.2" fill="#111111"/><rect x="1022" y="383.4" width="337.3" height="1.2" fill="#111111"/><rect x="1022" y="409.4" width="356.5" height="1.2" fill="#111111"/><rect x="1022" y="435.4" width="213.4" height="1.2" fill="#111111"/>
</svg>
