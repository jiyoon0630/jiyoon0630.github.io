<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" role="img" aria-label="[Era 3] Achieving Precision and Multimodality via VLM Knowledge + Continuous Action Generation">
<title>[Era 3] Achieving Precision and Multimodality via VLM Knowledge + Continuous Action Generation</title>
<rect width="1440" height="900" fill="#ffffff"/>
<text x="421.3" y="45.3" font-size="25" font-weight="700" fill="#111111" textLength="597.4" lengthAdjust="spacingAndGlyphs">[Era 3] “Achieving Precision and Multimodality via</text><text x="422.2" y="79.3" font-size="25" font-weight="700" fill="#111111" textLength="595.6" lengthAdjust="spacingAndGlyphs">VLM Knowledge + Continuous Action Generation”</text><rect x="421.3" y="48.3" width="597.4" height="2" fill="#111111"/><rect x="422.2" y="82.3" width="595.6" height="2" fill="#111111"/><text x="416.8" y="114.7" font-size="18" fill="#111111" textLength="606.4" lengthAdjust="spacingAndGlyphs">Leverages the VLM pipeline but, to generate Continuous Actions, introduces</text><text x="280.3" y="139.7" font-size="18" fill="#111111" textLength="879.4" lengthAdjust="spacingAndGlyphs">① a Diffusion-based Action Expert and ② a System 2 (perception/planning)–System 1 (control) 2-Stage design</text><polygon data-box="tag13" points="1282,37 1305,14 1434,14 1434,60 1305,60" fill="#dcefff"/><text x="1315.5" y="42.6" font-size="18" font-weight="700" fill="#111111" textLength="100" lengthAdjust="spacingAndGlyphs" data-in="tag13">Continuous</text><text x="20" y="192.3" font-size="19" font-weight="700" fill="#111111" textLength="391" lengthAdjust="spacingAndGlyphs">『① Diffusion-based Action Expert Trend』</text><rect x="20" y="194.5" width="391" height="1.4" fill="#111111"/><rect x="30" y="215.4" width="7" height="7" fill="#111111"/><text x="48" y="224.7" font-size="16.5" fill="#111111" textLength="1285.5" lengthAdjust="spacingAndGlyphs">Since a VLM is essentially a Decoder model that outputs natural language based on its visual + language understanding, the VLM pipeline is modified as “language model Head</text><text x="1338.1" y="224.7" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" fill="#111111" textLength="13.8" lengthAdjust="spacingAndGlyphs">→</text><text x="48" y="249.7" font-size="16.5" fill="#111111" textLength="455.6" lengthAdjust="spacingAndGlyphs">Diffusion-based Action Expert” to generate Continuous Actions</text><rect x="30" y="269.2" width="7" height="7" fill="#111111"/><text x="48" y="278.5" font-size="16.5" fill="#111111" textLength="31.2" lengthAdjust="spacingAndGlyphs">This</text><text x="83.8" y="278.5" font-size="16.5" font-weight="700" fill="#111111" textLength="633.5" lengthAdjust="spacingAndGlyphs">removes the information loss caused by quantization, securing control precision</text><text x="717.3" y="278.5" font-size="16.5" fill="#111111" textLength="4.6" lengthAdjust="spacingAndGlyphs">,</text><text x="726.5" y="278.5" font-size="16.5" font-weight="700" fill="#111111" textLength="620.1" lengthAdjust="spacingAndGlyphs">guarantees temporal consistency (Smoothness) by predicting an Action Chunk</text><text x="48" y="303.5" font-size="16.5" fill="#111111" textLength="238.5" lengthAdjust="spacingAndGlyphs">spanning k future timesteps, and</text><text x="291.1" y="303.5" font-size="16.5" font-weight="700" fill="#111111" textLength="423.4" lengthAdjust="spacingAndGlyphs">captures Multimodality to improve Task success rates</text><rect x="83.8" y="280.5" width="633.5" height="1.2" fill="#111111"/><rect x="726.5" y="280.5" width="620.1" height="1.2" fill="#111111"/><rect x="291.1" y="305.5" width="423.4" height="1.2" fill="#111111"/><rect data-box="box14" x="22" y="334" width="368" height="202.8" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="81.3" y="366.7" font-size="18" font-weight="700" fill="#111111" textLength="249.4" lengthAdjust="spacingAndGlyphs" data-in="box14">CogAct (arXiv 2024, MS Asia)</text><text x="39.8" y="398.5" font-size="16" font-weight="700" fill="#111111" textLength="332.5" lengthAdjust="spacingAndGlyphs" data-in="box14">Keeps the VLM frozen and injects its output</text><text x="57.9" y="421.7" font-size="16" font-weight="700" fill="#111111" textLength="139.6" lengthAdjust="spacingAndGlyphs" data-in="box14">features into a DiT</text><text x="202" y="421.7" font-size="16" fill="#111111" textLength="152.1" lengthAdjust="spacingAndGlyphs" data-in="box14">(adaLN conditioning),</text><text x="43.4" y="444.9" font-size="16" fill="#111111" textLength="325.1" lengthAdjust="spacingAndGlyphs" data-in="box14">conveying visual + language understanding of</text><text x="171.3" y="468.1" font-size="16" fill="#111111" textLength="69.4" lengthAdjust="spacingAndGlyphs" data-in="box14">the scene</text><text x="49.1" y="491.3" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box14">→</text><text x="66.9" y="491.3" font-size="16" font-weight="700" fill="#111111" textLength="296" lengthAdjust="spacingAndGlyphs" data-in="box14">with the VLM frozen, it is hard to select</text><text x="56.6" y="514.5" font-size="16" font-weight="700" fill="#111111" textLength="298.7" lengthAdjust="spacingAndGlyphs" data-in="box14">the information that matters for actions</text><rect x="39.8" y="400.4" width="332.5" height="1.2" fill="#111111"/><rect x="57.9" y="423.6" width="139.6" height="1.2" fill="#111111"/><rect x="66.9" y="493.2" width="296" height="1.2" fill="#111111"/><rect x="56.6" y="516.4" width="298.7" height="1.2" fill="#111111"/><rect data-box="box15" x="538" y="334" width="368" height="202.8" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="566.1" y="366.7" font-family="'Cambria Math', Cambria, 'Times New Roman', Times, serif" font-style="italic" font-size="20.2" font-weight="700" fill="#111111" textLength="11" lengthAdjust="spacingAndGlyphs" data-in="box15">π</text><text x="577.5" y="370.7" font-family="'Cambria Math', Cambria, 'Times New Roman', Times, serif" font-size="13.7" font-weight="700" fill="#111111" textLength="6.8" lengthAdjust="spacingAndGlyphs" data-in="box15">0</text><text x="589.7" y="366.7" font-size="18" font-weight="700" fill="#111111" textLength="288.1" lengthAdjust="spacingAndGlyphs" data-in="box15">(arXiv 2024, Physical Intelligence)</text><rect x="582.7" y="477.2" width="296.4" height="18.6" fill="#fff200"/><rect x="585.8" y="500.4" width="272.4" height="18.6" fill="#fff200"/><text x="564.1" y="398.5" font-size="16" fill="#111111" textLength="315.7" lengthAdjust="spacingAndGlyphs" data-in="box15">Injects action information starting at the VLM</text><text x="562" y="421.7" font-size="16" fill="#111111" textLength="39.1" lengthAdjust="spacingAndGlyphs" data-in="box15">input,</text><text x="605.6" y="421.7" font-size="16" font-weight="700" fill="#111111" textLength="276.5" lengthAdjust="spacingAndGlyphs" data-in="box15">generating dynamic actions through</text><text x="581.1" y="444.9" font-size="16" font-weight="700" fill="#111111" textLength="281.9" lengthAdjust="spacingAndGlyphs" data-in="box15">cross-referencing of image · sensor ·</text><text x="656.2" y="468.1" font-size="16" font-weight="700" fill="#111111" textLength="131.6" lengthAdjust="spacingAndGlyphs" data-in="box15">language · action</text><text x="566.4" y="491.3" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box15">→</text><text x="584.2" y="491.3" font-size="16" font-weight="700" fill="#111111" textLength="293.4" lengthAdjust="spacingAndGlyphs" data-in="box15">improves inference speed and training</text><text x="587.3" y="514.5" font-size="16" font-weight="700" fill="#111111" textLength="269.4" lengthAdjust="spacingAndGlyphs" data-in="box15">stability by applying Flow Matching</text><rect x="605.6" y="423.6" width="276.5" height="1.2" fill="#111111"/><rect x="581.1" y="446.8" width="281.9" height="1.2" fill="#111111"/><rect x="656.2" y="470" width="131.6" height="1.2" fill="#111111"/><rect x="584.2" y="493.2" width="293.4" height="1.2" fill="#111111"/><rect x="587.3" y="516.4" width="269.4" height="1.2" fill="#111111"/><line x1="390" y1="435.4" x2="525" y2="435.4" stroke="#1f1f1f" stroke-width="2"/><polygon points="538,435.4 525,442.4 525,428.4" fill="#1f1f1f"/><text x="408.8" y="421.4" font-size="15" font-weight="700" fill="#1a7f37" textLength="110.5" lengthAdjust="spacingAndGlyphs">+ VLM unfreeze</text><text x="20" y="584.5" font-size="19" font-weight="700" fill="#111111" textLength="657.8" lengthAdjust="spacingAndGlyphs">『② System 2 (Perception/Planning)–System 1 (Control) 2-Stage Trend』</text><rect x="20" y="586.7" width="657.8" height="1.4" fill="#111111"/><rect x="30" y="607.6" width="7" height="7" fill="#111111"/><text x="48" y="616.9" font-size="16.5" font-weight="700" fill="#111111" textLength="1117.6" lengthAdjust="spacingAndGlyphs">Separating perception/planning (slow reasoning) from precision control (which needs fast reasoning) into multiple stages and optimizing each</text><text x="1170.1" y="616.9" font-size="16.5" fill="#111111" textLength="225.7" lengthAdjust="spacingAndGlyphs">enables high-frequency control</text><text x="1400.4" y="616.9" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16.5" fill="#111111" textLength="13.8" lengthAdjust="spacingAndGlyphs">→</text><text x="48" y="641.9" font-size="16.5" fill="#111111" textLength="730" lengthAdjust="spacingAndGlyphs">mimics the human nervous system for robots such as humanoids, where fast reactions are essential</text><rect x="48" y="618.9" width="1117.6" height="1.2" fill="#111111"/><rect data-box="box16" x="22" y="672.4" width="368" height="202.8" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="74.4" y="705.1" font-size="18" font-weight="700" fill="#111111" textLength="263.1" lengthAdjust="spacingAndGlyphs" data-in="box16">GR00T N1 (arXiv 2025, NVIDIA)</text><rect x="62.3" y="815.6" width="305.2" height="18.6" fill="#fff200"/><rect x="141.8" y="838.8" width="128.4" height="18.6" fill="#fff200"/><text x="52.1" y="736.9" font-size="16" fill="#111111" textLength="307.8" lengthAdjust="spacingAndGlyphs" data-in="box16">Introduces asynchronous parallel execution</text><text x="41.2" y="760.1" font-size="16" fill="#111111" textLength="329.7" lengthAdjust="spacingAndGlyphs" data-in="box16">into a decoupled VLM-DiT architecture, so that</text><text x="44.2" y="783.3" font-size="16" font-weight="700" fill="#111111" textLength="323.7" lengthAdjust="spacingAndGlyphs" data-in="box16">System 1 generates actions independently</text><text x="125.5" y="806.5" font-size="16" font-weight="700" fill="#111111" textLength="161" lengthAdjust="spacingAndGlyphs" data-in="box16">while System 2 plans</text><text x="46" y="829.7" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box16">→</text><text x="63.8" y="829.7" font-size="16" font-weight="700" fill="#111111" textLength="302.2" lengthAdjust="spacingAndGlyphs" data-in="box16">the starting point of real-time humanoid</text><text x="143.3" y="852.9" font-size="16" font-weight="700" fill="#111111" textLength="125.4" lengthAdjust="spacingAndGlyphs" data-in="box16">control research</text><rect x="44.2" y="785.2" width="323.7" height="1.2" fill="#111111"/><rect x="125.5" y="808.4" width="161" height="1.2" fill="#111111"/><rect x="63.8" y="831.6" width="302.2" height="1.2" fill="#111111"/><rect x="143.3" y="854.8" width="125.4" height="1.2" fill="#111111"/><rect data-box="box17" x="538" y="672.4" width="368" height="202.8" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="561" y="705.1" font-family="'Cambria Math', Cambria, 'Times New Roman', Times, serif" font-style="italic" font-size="20.2" font-weight="700" fill="#111111" textLength="11" lengthAdjust="spacingAndGlyphs" data-in="box17">π</text><text x="572.4" y="709.1" font-family="'Cambria Math', Cambria, 'Times New Roman', Times, serif" font-size="13.7" font-weight="700" fill="#111111" textLength="17.1" lengthAdjust="spacingAndGlyphs" data-in="box17">0.5</text><text x="594.8" y="705.1" font-size="18" font-weight="700" fill="#111111" textLength="288.1" lengthAdjust="spacingAndGlyphs" data-in="box17">(arXiv 2025, Physical Intelligence)</text><rect x="586.3" y="815.6" width="289.4" height="18.6" fill="#fff200"/><rect x="685.8" y="838.8" width="72.4" height="18.6" fill="#fff200"/><text x="563.9" y="736.9" font-size="16" fill="#111111" textLength="287.7" lengthAdjust="spacingAndGlyphs" data-in="box17">With a VLM + Action Expert architecture,</text><text x="856.1" y="736.9" font-size="16" font-weight="700" fill="#111111" textLength="24" lengthAdjust="spacingAndGlyphs" data-in="box17">the</text><text x="558.9" y="760.1" font-size="16" font-weight="700" fill="#111111" textLength="326.3" lengthAdjust="spacingAndGlyphs" data-in="box17">model outputs its plan in natural language,</text><text x="568.2" y="783.3" font-size="16" font-weight="700" fill="#111111" textLength="307.7" lengthAdjust="spacingAndGlyphs" data-in="box17">then generates actions for each Subtask</text><text x="649.5" y="806.5" font-size="16" font-weight="700" fill="#111111" textLength="144.9" lengthAdjust="spacingAndGlyphs" data-in="box17">(Plan-and-Execute)</text><text x="569.9" y="829.7" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box17">→</text><text x="587.8" y="829.7" font-size="16" font-weight="700" fill="#111111" textLength="286.4" lengthAdjust="spacingAndGlyphs" data-in="box17">mistakes can be corrected via Human</text><text x="687.3" y="852.9" font-size="16" font-weight="700" fill="#111111" textLength="69.4" lengthAdjust="spacingAndGlyphs" data-in="box17">feedback</text><rect x="856.1" y="738.8" width="24" height="1.2" fill="#111111"/><rect x="558.9" y="762" width="326.3" height="1.2" fill="#111111"/><rect x="568.2" y="785.2" width="307.7" height="1.2" fill="#111111"/><rect x="649.5" y="808.4" width="144.9" height="1.2" fill="#111111"/><rect x="587.8" y="831.6" width="286.4" height="1.2" fill="#111111"/><rect x="687.3" y="854.8" width="69.4" height="1.2" fill="#111111"/><rect data-box="box18" x="1054" y="672.4" width="368" height="202.8" rx="16" fill="#ecdef5" stroke="#2a1b3d" stroke-width="2.6"/><text x="1131.8" y="705.1" font-size="18" font-weight="700" fill="#111111" textLength="212.4" lengthAdjust="spacingAndGlyphs" data-in="box18">Helix 02 (2026, Figure AI)</text><rect x="1120.1" y="815.6" width="253.7" height="18.6" fill="#fff200"/><rect x="1105.2" y="838.8" width="265.7" height="18.6" fill="#fff200"/><text x="1103.3" y="736.9" font-size="16" fill="#111111" textLength="256.1" lengthAdjust="spacingAndGlyphs" data-in="box18">Adds to the System 1·2 dual system</text><text x="1363.8" y="736.9" font-size="16" font-weight="700" fill="#111111" textLength="8.9" lengthAdjust="spacingAndGlyphs" data-in="box18">a</text><text x="1087.3" y="760.1" font-size="16" font-weight="700" fill="#111111" textLength="301.4" lengthAdjust="spacingAndGlyphs" data-in="box18">System 0 (1kHz) that learns whole-body</text><text x="1090.8" y="783.3" font-size="16" font-weight="700" fill="#111111" textLength="294.3" lengthAdjust="spacingAndGlyphs" data-in="box18">balance and contact reflexes, securing</text><text x="1173.5" y="806.5" font-size="16" font-weight="700" fill="#111111" textLength="128.9" lengthAdjust="spacingAndGlyphs" data-in="box18">physical stability</text><text x="1103.7" y="829.7" font-family="'Segoe UI Symbol', 'DejaVu Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="16" fill="#111111" textLength="13.4" lengthAdjust="spacingAndGlyphs" data-in="box18">→</text><text x="1121.6" y="829.7" font-size="16" font-weight="700" fill="#111111" textLength="250.7" lengthAdjust="spacingAndGlyphs" data-in="box18">first to achieve unified humanoid</text><text x="1106.7" y="852.9" font-size="16" font-weight="700" fill="#111111" textLength="262.7" lengthAdjust="spacingAndGlyphs" data-in="box18">locomotion + manipulation control</text><rect x="1363.8" y="738.8" width="8.9" height="1.2" fill="#111111"/><rect x="1087.3" y="762" width="301.4" height="1.2" fill="#111111"/><rect x="1090.8" y="785.2" width="294.3" height="1.2" fill="#111111"/><rect x="1173.5" y="808.4" width="128.9" height="1.2" fill="#111111"/><rect x="1121.6" y="831.6" width="250.7" height="1.2" fill="#111111"/><rect x="1106.7" y="854.8" width="262.7" height="1.2" fill="#111111"/><line x1="390" y1="773.8" x2="525" y2="773.8" stroke="#1f1f1f" stroke-width="2"/><polygon points="538,773.8 525,780.8 525,766.8" fill="#1f1f1f"/><text x="430.9" y="738.7" font-size="15" font-weight="700" fill="#1a7f37" textLength="66.3" lengthAdjust="spacingAndGlyphs">+ Explicit</text><text x="425.7" y="759.7" font-size="15" font-weight="700" fill="#1a7f37" textLength="76.7" lengthAdjust="spacingAndGlyphs">Reasoning</text><line x1="906" y1="773.8" x2="1041" y2="773.8" stroke="#1f1f1f" stroke-width="2"/><polygon points="1054,773.8 1041,780.8 1041,766.8" fill="#1f1f1f"/><text x="930.6" y="738.7" font-size="15" font-weight="700" fill="#1a7f37" textLength="98.8" lengthAdjust="spacingAndGlyphs">+ Extended to</text><text x="910.8" y="759.7" font-size="15" font-weight="700" fill="#1a7f37" textLength="138.3" lengthAdjust="spacingAndGlyphs">whole-body control</text>
</svg>
