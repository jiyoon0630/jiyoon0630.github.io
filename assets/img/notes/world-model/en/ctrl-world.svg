<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 860" width="1400" height="860" role="img" aria-label="Ctrl-World: a frozen world model runs a VLA in imagination; successful rollouts fine-tune the VLA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>Ctrl-World: a frozen world model runs a VLA in imagination; successful rollouts fine-tune the VLA</title>
<defs>
<marker id="a9aa0a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6"/></marker>
<marker id="a3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
</defs>
<rect width="1400" height="860" fill="#ffffff"/>
<text x="80" y="66" font-size="30" font-weight="700" fill="#1f2328">Ctrl-World: build the world model → freeze → improve the VLA</text>
<rect x="810" y="118" width="380" height="100" rx="14" fill="#efece4" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="1000.0" y="161.9" font-size="23" font-weight="700" fill="#3f3a2f" text-anchor="middle">DROID real data</text>
<text x="1000.0" y="188.9" font-size="17" fill="#3f3a2f" text-anchor="middle">95k · successes + failures</text>
<line x1="1000" y1="224" x2="1000" y2="336" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<text x="1000.0" y="252.0" font-size="16" fill="#6b7280" text-anchor="middle">train, then freeze</text>
<rect x="150" y="310" width="1110" height="250" rx="16" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="170" y="298" font-size="17" fill="#6b7280">imagination · training time only</text>
<rect x="208" y="368" width="350" height="120" rx="14" fill="#dce9fb" stroke="#b6d0f2" stroke-width="1.5"/>
<text x="383.0" y="421.9" font-size="23" font-weight="700" fill="#123a6b" text-anchor="middle">VLA (policy)</text>
<text x="383.0" y="448.9" font-size="17" fill="#123a6b" text-anchor="middle">observation → action</text>
<rect x="824" y="368" width="350" height="120" rx="14" fill="#e9e6f9" stroke="#c9c2ee" stroke-width="1.5"/>
<text x="999.0" y="421.9" font-size="23" font-weight="700" fill="#3b2f7a" text-anchor="middle">World model (frozen)</text>
<text x="999.0" y="448.9" font-size="17" fill="#3b2f7a" text-anchor="middle">action → future observation</text>
<line x1="570" y1="404" x2="812" y2="404" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<text x="691.0" y="390.0" font-size="16" fill="#6b7280" text-anchor="middle">action</text>
<line x1="812" y1="458" x2="570" y2="458" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<text x="691.0" y="484.0" font-size="16" fill="#6b7280" text-anchor="middle">future observation</text>
<line x1="410" y1="566" x2="410" y2="634" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<text x="410.0" y="604.0" font-size="16" fill="#6b7280" text-anchor="start">repeat → rollout complete</text>
<rect x="228" y="636" width="372" height="108" rx="14" fill="#d9efe7" stroke="#a9d9c8" stroke-width="1.5"/>
<text x="414.0" y="683.9" font-size="23" font-weight="700" fill="#155f4a" text-anchor="middle">Select successful rollouts</text>
<text x="414.0" y="710.9" font-size="17" fill="#155f4a" text-anchor="middle">keep only the successes</text>
<line x1="612" y1="690" x2="752" y2="690" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<rect x="764" y="636" width="372" height="108" rx="14" fill="#e7f1d8" stroke="#c9dfae" stroke-width="1.5"/>
<text x="950.0" y="683.9" font-size="23" font-weight="700" fill="#3f5c1c" text-anchor="middle">Improve the VLA by SFT</text>
<text x="950.0" y="710.9" font-size="17" fill="#3f5c1c" text-anchor="middle">(observation, action) data</text>
<text x="700" y="800" font-size="17" fill="#6b7280" text-anchor="middle">↻ only the improved VLA returns to the loop — the world model stays frozen throughout</text>
<text x="700" y="826" font-size="17" fill="#6b7280" text-anchor="middle">At deployment: only the improved VLA runs → the world model drops out</text>
</svg>
