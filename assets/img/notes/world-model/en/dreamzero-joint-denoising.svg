<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 776" width="1400" height="776" role="img" aria-label="DreamZero: one Diffusion Transformer denoises future video and actions together, closed-loop" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>DreamZero: one Diffusion Transformer denoises future video and actions together, closed-loop</title>
<defs>
<marker id="a9aa0a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6"/></marker>
<marker id="a3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
</defs>
<rect width="1400" height="776" fill="#ffffff"/>
<text x="60" y="56" font-size="30" font-weight="700" fill="#1f2328">DreamZero (NVIDIA · WAM / GR00T N2, 2026): joint denoising</text>
<text x="60" y="86" font-size="17" fill="#6b7280">‘World Action Models are Zero-shot Policies’ — zero-shot on unseen tasks, environments and robots</text>
<rect x="48" y="210" width="274" height="200" rx="14" fill="#dce9fb" stroke="#b6d0f2" stroke-width="1.5"/>
<text x="185.0" y="263.4" font-size="23" font-weight="700" fill="#123a6b" text-anchor="middle">① Input (inference)</text>
<text x="185.0" y="290.4" font-size="17" fill="#123a6b" text-anchor="middle"></text>
<text x="185.0" y="317.4" font-size="17" fill="#123a6b" text-anchor="middle">current observation (video)</text>
<text x="185.0" y="344.4" font-size="17" fill="#123a6b" text-anchor="middle">+ language instruction</text>
<text x="185.0" y="371.4" font-size="17" fill="#123a6b" text-anchor="middle">+ robot state</text>
<rect x="366" y="186" width="352" height="262" rx="14" fill="#e9e6f9" stroke="#c9c2ee" stroke-width="1.5"/>
<text x="542.0" y="239.9" font-size="23" font-weight="700" fill="#3b2f7a" text-anchor="middle">② DiT — joint denoising</text>
<text x="542.0" y="264.9" font-size="16" fill="#3b2f7a" text-anchor="middle">single DiT · Wan 2.1-I2V-14B</text>
<text x="542.0" y="289.9" font-size="16" fill="#3b2f7a" text-anchor="middle"></text>
<text x="542.0" y="314.9" font-size="16" fill="#3b2f7a" text-anchor="middle">future video + action tokens,</text>
<text x="542.0" y="339.9" font-size="16" fill="#3b2f7a" text-anchor="middle">one denoising process</text>
<text x="542.0" y="364.9" font-size="16" fill="#3b2f7a" text-anchor="middle">(autoregressive + flow matching)</text>
<rect x="392" y="398" width="300" height="32" rx="16" fill="#fbe6d8" stroke="#eecdb4"/>
<text x="542" y="420" font-size="15" fill="#8a4b1f" text-anchor="middle">no separate IDM module · end-to-end</text>
<rect x="762" y="210" width="274" height="200" rx="14" fill="#dce9fb" stroke="#b6d0f2" stroke-width="1.5"/>
<text x="899.0" y="263.4" font-size="23" font-weight="700" fill="#123a6b" text-anchor="middle">③ Robot execution</text>
<text x="899.0" y="290.4" font-size="17" fill="#123a6b" text-anchor="middle"></text>
<text x="899.0" y="317.4" font-size="17" fill="#123a6b" text-anchor="middle">run the generated</text>
<text x="899.0" y="344.4" font-size="17" fill="#123a6b" text-anchor="middle">action chunk on the</text>
<text x="899.0" y="371.4" font-size="17" fill="#123a6b" text-anchor="middle">real robot</text>
<rect x="1080" y="210" width="274" height="200" rx="14" fill="#e7f1d8" stroke="#c9dfae" stroke-width="1.5"/>
<text x="1217.0" y="263.4" font-size="23" font-weight="700" fill="#3f5c1c" text-anchor="middle">④ Frame replacement</text>
<text x="1217.0" y="290.4" font-size="17" fill="#3f5c1c" text-anchor="middle"></text>
<text x="1217.0" y="317.4" font-size="17" fill="#3f5c1c" text-anchor="middle">generated frames →</text>
<text x="1217.0" y="344.4" font-size="17" fill="#3f5c1c" text-anchor="middle">real observed frames</text>
<text x="1217.0" y="371.4" font-size="17" fill="#3f5c1c" text-anchor="middle">(stops error accumulating)</text>
<line x1="330" y1="310" x2="358" y2="310" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<line x1="726" y1="310" x2="754" y2="310" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<line x1="1044" y1="310" x2="1072" y2="310" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<path d="M 1217 418 L 1217 484 L 185 484 L 185 418" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#a3b82f6)"/>
<text x="700" y="520" font-size="17" fill="#6b7280" text-anchor="middle">⑤ repeat ①–④ every chunk → the task runs closed-loop</text>
<rect x="200" y="552" width="1000" height="132" rx="14" fill="#e7f1d8" stroke="#c9dfae" stroke-width="1.5"/>
<text x="700" y="590" font-size="20" font-weight="700" fill="#3f5c1c" text-anchor="middle">Result — zero-shot generalization, about 2× SOTA VLAs on unseen tasks and environments</text>
<text x="700" y="622" font-size="22" font-weight="700" fill="#3f5c1c" text-anchor="middle">39.5% average on tasks never seen in training</text>
<text x="700" y="650" font-size="16" fill="#4f6b2c" text-anchor="middle">vs. under 1% trained from scratch · 16.3% for a large pre-trained VLA (untying laces, ironing, shaking hands)</text>
<text x="700" y="672" font-size="16" fill="#4f6b2c" text-anchor="middle">DROID alone, no large-scale cross-embodiment training · RoboArena (real) 1750 &gt; π0.5 1622</text>
<text x="700" y="726" font-size="17" fill="#6b7280" text-anchor="middle">One DiT generates video and action in the same denoising — end-to-end, no IDM (vs. DreamGen's two stages)</text>
<text x="700" y="752" font-size="17" fill="#6b7280" text-anchor="middle">‘Video generation quality is the main lever on policy performance’ · GR00T N2 to be released on this WAM</text>
</svg>
