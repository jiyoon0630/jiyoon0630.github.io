<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 846" width="1400" height="846" role="img" aria-label="π0.7: a separate world model generates subgoal images that condition the VLA at every inference step" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>π0.7: a separate world model generates subgoal images that condition the VLA at every inference step</title>
<defs>
<marker id="a9aa0a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6"/></marker>
<marker id="a3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
</defs>
<rect width="1400" height="846" fill="#ffffff"/>
<text x="70" y="62" font-size="30" font-weight="700" fill="#1f2328">π0.7: world model decoupled, but always coupled at inference (online)</text>
<rect x="88" y="160" width="1110" height="486" rx="16" fill="none" stroke="#9aa0a6" stroke-width="1.6" stroke-dasharray="7 6"/>
<text x="322" y="196" font-size="17" fill="#6b7280" text-anchor="middle">inference · deployment · running at every step (online)</text>
<rect x="132" y="248" width="460" height="320" rx="16" fill="#dce9fb" stroke="#b6d0f2" stroke-width="1.5"/>
<text x="362" y="300" font-size="25" font-weight="700" fill="#123a6b" text-anchor="middle">π0.7 VLA (5B)</text>
<rect x="156" y="328" width="412" height="106" rx="12" fill="#dce9fb" stroke="#b6d0f2" stroke-width="1.5"/>
<text x="362.0" y="374.2" font-size="21" font-weight="700" fill="#123a6b" text-anchor="middle">① High-level</text>
<text x="362.0" y="401.2" font-size="16" fill="#123a6b" text-anchor="middle">current observation → next subtask</text>
<rect x="156" y="450" width="412" height="106" rx="12" fill="#dce9fb" stroke="#b6d0f2" stroke-width="1.5"/>
<text x="362.0" y="496.2" font-size="21" font-weight="700" fill="#123a6b" text-anchor="middle">② Action Expert</text>
<text x="362.0" y="523.2" font-size="16" fill="#123a6b" text-anchor="middle">current observation + subgoal image → action</text>
<rect x="788" y="300" width="386" height="268" rx="14" fill="#e9e6f9" stroke="#c9c2ee" stroke-width="1.5"/>
<text x="981.0" y="362.0" font-size="25" font-weight="700" fill="#3b2f7a" text-anchor="middle">World Model</text>
<text x="981.0" y="389.0" font-size="17" fill="#3b2f7a" text-anchor="middle">BAGEL-based · lightweight</text>
<text x="981.0" y="416.0" font-size="17" fill="#3b2f7a" text-anchor="middle"></text>
<text x="981.0" y="443.0" font-size="17" fill="#3b2f7a" text-anchor="middle">subtask → near-future</text>
<text x="981.0" y="470.0" font-size="17" fill="#3b2f7a" text-anchor="middle">subgoal image</text>
<rect x="812" y="516" width="338" height="34" rx="17" fill="#ddd8f5" stroke="#c9c2ee"/>
<text x="981" y="539" font-size="15" fill="#3b2f7a" text-anchor="middle">a module separate from the VLA (decoupled)</text>
<line x1="600" y1="366" x2="780" y2="366" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<text x="690.0" y="352.0" font-size="16" fill="#6b7280" text-anchor="middle">subtask (language instruction)</text>
<line x1="780" y1="470" x2="600" y2="470" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<text x="690.0" y="496.0" font-size="16" fill="#6b7280" text-anchor="middle">subgoal image</text>
<line x1="362" y1="576" x2="362" y2="672" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<rect x="236" y="674" width="254" height="66" rx="14" fill="#e7f1d8" stroke="#c9dfae" stroke-width="1.5"/>
<text x="363.0" y="713.7" font-size="21" font-weight="700" fill="#3f5c1c" text-anchor="middle">action → environment</text>
<text x="700" y="796" font-size="17" fill="#6b7280" text-anchor="middle">The modules are decoupled, yet at inference they trade subtask ↔ subgoal every step (online)</text>
<text x="700" y="822" font-size="17" fill="#6b7280" text-anchor="middle">→ where this parts from Section 3, which uses the WM's output only as offline data</text>
</svg>
