<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 600" width="1400" height="600" role="img" aria-label="VLAW: a loop that alternately improves the world model and the VLA" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
<title>VLAW: a loop that alternately improves the world model and the VLA</title>
<defs>
<marker id="a9aa0a6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#9aa0a6"/></marker>
<marker id="a3b82f6" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#3b82f6"/></marker>
</defs>
<rect width="1400" height="600" fill="#ffffff"/>
<text x="80" y="70" font-size="30" font-weight="700" fill="#1f2328">VLAW: improve the world model and the VLA alternately</text>
<rect x="48" y="196" width="300" height="150" rx="14" fill="#efece4" stroke="#d8d2c4" stroke-width="1.5"/>
<text x="198.0" y="251.4" font-size="23" font-weight="700" fill="#3f3a2f" text-anchor="middle">① Collect rollouts</text>
<text x="198.0" y="278.4" font-size="17" fill="#3f3a2f" text-anchor="middle">on a real robot,</text>
<text x="198.0" y="305.4" font-size="17" fill="#3f3a2f" text-anchor="middle">successes + failures</text>
<line x1="356" y1="271.0" x2="392" y2="271.0" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<rect x="400" y="196" width="300" height="150" rx="14" fill="#e9e6f9" stroke="#c9c2ee" stroke-width="1.5"/>
<text x="550.0" y="251.4" font-size="23" font-weight="700" fill="#3b2f7a" text-anchor="middle">② Improve the WM</text>
<text x="550.0" y="278.4" font-size="17" fill="#3b2f7a" text-anchor="middle">fidelity ↑ from real</text>
<text x="550.0" y="305.4" font-size="17" fill="#3b2f7a" text-anchor="middle">rollouts (failures too)</text>
<line x1="708" y1="271.0" x2="744" y2="271.0" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<rect x="752" y="196" width="300" height="150" rx="14" fill="#e9e6f9" stroke="#c9c2ee" stroke-width="1.5"/>
<text x="902.0" y="251.4" font-size="23" font-weight="700" fill="#3b2f7a" text-anchor="middle">③ Synthesize rollouts</text>
<text x="902.0" y="278.4" font-size="17" fill="#3b2f7a" text-anchor="middle">at scale with the improved</text>
<text x="902.0" y="305.4" font-size="17" fill="#3b2f7a" text-anchor="middle">WM · auto-labeled</text>
<line x1="1060" y1="271.0" x2="1096" y2="271.0" stroke="#9aa0a6" stroke-width="2.2" marker-end="url(#a9aa0a6)"/>
<rect x="1104" y="196" width="300" height="150" rx="14" fill="#dce9fb" stroke="#b6d0f2" stroke-width="1.5"/>
<text x="1254.0" y="251.4" font-size="23" font-weight="700" fill="#123a6b" text-anchor="middle">④ Improve the VLA</text>
<text x="1254.0" y="278.4" font-size="17" fill="#123a6b" text-anchor="middle">success rate ↑ from</text>
<text x="1254.0" y="305.4" font-size="17" fill="#123a6b" text-anchor="middle">synthetic data</text>
<path d="M 1254.0 346 L 1254.0 430 L 198 430 L 198 354" fill="none" stroke="#3b82f6" stroke-width="2.2" stroke-dasharray="8 7" marker-end="url(#a3b82f6)"/>
<text x="700" y="474" font-size="17" fill="#6b7280" text-anchor="middle">⑤ repeat from ① with the improved VLA</text>
<text x="700" y="530" font-size="17" fill="#6b7280" text-anchor="middle">Improving the world model (②) and the VLA (④) alternately = co-improvement</text>
<text x="700" y="556" font-size="17" fill="#6b7280" text-anchor="middle">Unlike Ctrl-World the world model is not frozen · +39.2%p over the base policy</text>
</svg>
